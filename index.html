<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7d82ea" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Jeu d'échecs moderne avec IA et multijoueur" />

    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JemaChess" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="JemaChess" />
    <meta name="msapplication-TileColor" content="#7d82ea" />
    <meta name="msapplication-TileImage" content="/icons/icon-192x192.svg" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="HandheldFriendly" content="true" />

    <!-- Apply the saved/system theme before the first paint (no flash) -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('jemachess-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          theme = saved === 'light' || saved === 'dark' ? saved : (prefersDark ? 'dark' : 'light');
        } catch (error) {
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light';
          }
        }
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;

        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.setAttribute('content', theme === 'light' ? '#f2f4fa' : '#0a0a0f');
        }
        var tileColor = document.querySelector('meta[name="msapplication-TileColor"]');
        if (tileColor) {
          tileColor.setAttribute('content', theme === 'light' ? '#f2f4fa' : '#0a0a0f');
        }
        var statusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (statusBar) {
          statusBar.setAttribute('content', theme === 'light' ? 'default' : 'black-translucent');
        }
      })();
    </script>

    <!-- Manifest is injected by vite-plugin-pwa at build time -->
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon-512x512.svg" />
    <link rel="icon" type="image/svg+xml" sizes="192x192" href="/icons/icon-192x192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.svg" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-192x192.svg" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-192x192.svg" />
    
    <title>JemaChess</title>
    
    <style>
      /* Minimal boot styles - the application theme lives in src/ui/styles */
      :root {
        color-scheme: dark;
        --boot-primary: #7d82ea;
        --boot-bg: #0a0a0f;
        --boot-text: rgba(255, 255, 255, 0.95);
        --boot-text-secondary: rgba(255, 255, 255, 0.7);
        --boot-border: rgba(255, 255, 255, 0.15);
        --spacing-md: 16px;
      }

      :root[data-theme='light'] {
        color-scheme: light;
        --boot-primary: #565bd1;
        --boot-bg: #f2f4fa;
        --boot-text: #151a2d;
        --boot-text-secondary: rgba(21, 26, 45, 0.72);
        --boot-border: rgba(15, 23, 42, 0.15);
      }

      /* Reset */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      html, body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: var(--boot-bg);
      }
      
      body {
        font-family: 'Inter', 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background: var(--boot-bg);
        color: var(--boot-text);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        touch-action: manipulation;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      
      /* App Container */
      #app {
        width: 100%;
        height: 100%;
        display: block;
        position: relative;
      }
      
      /* Loading state - centered */
      #app > .loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      
      /* Landing page and other content - full screen */
      #app > .landing-page,
      #app > .game-container,
      #app > .main-menu,
      #app > .lobby-container,
      #app > .settings-container {
        width: 100%;
        height: 100%;
      }
      
      /* Loading State */
      .loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--spacing-md);
      }
      
      .loading-spinner {
        width: 48px;
        height: 48px;
        border: 3px solid var(--boot-border);
        border-top-color: var(--boot-primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      
      .loading-text {
        color: var(--boot-text-secondary);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="loading">
        <div class="loading-spinner"></div>
        <span class="loading-text">Chargement de JemaChess...</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
